[package]
name = "vulcan-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Synchronous Language Server Protocol transport for Vulcan vaults"

[features]
default = ["js_runtime"]
# Evaluate `dataviewjs` blocks in `vulcan/render`; without it they render as a notice.
js_runtime = ["vulcan-app/js_runtime", "vulcan-core/js_runtime"]

[dependencies]
crossbeam-channel.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
vulcan-app = { path = "../vulcan-app", version = "0.4.0", default-features = false }
vulcan-core = { path = "../vulcan-core", version = "0.4.0", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
