name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87 # v2
        with:
          command: check advisories bans licenses sources

      - name: Test checked-in security automation
        run: python -m unittest discover -s scripts/security/tests -v

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: msrv-1.90.0

      - name: Check workspace on MSRV
        run: cargo check --workspace --all-targets

  release-tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Python for release tooling
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Test archive and POSIX installer tooling
        if: runner.os == 'Linux'
        run: |
          shellcheck scripts/install.sh
          python -m unittest discover -s scripts/release/tests -v

      - name: Test PowerShell installer dry run
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install.ps1 -Version 0.2.1 -DryRun

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        suite: [core, cli]
    name: test (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.suite }}

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.suite == 'cli'
        run: cargo fmt --all --check

      - name: Test workspace except CLI
        if: matrix.suite == 'core'
        run: cargo test --workspace --exclude vulcan-cli --no-fail-fast

      # The vulcan.nvim smoke test (vulcan-cli/tests/nvim_plugin.rs) skips
      # without Neovim. Install the oldest supported release, checksum
      # pinned, and make a missing Neovim a failure.
      - name: Install Neovim for the plugin smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.suite == 'cli'
        env:
          NVIM_VERSION: v0.10.4
          NVIM_SHA256: 95aaa8e89473f5421114f2787c13ae0ec6e11ebbd1a13a1bd6fcf63420f8073f
        run: |
          curl -fsSLo "$RUNNER_TEMP/nvim.tar.gz" \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          echo "${NVIM_SHA256}  $RUNNER_TEMP/nvim.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "VULCAN_REQUIRE_NVIM=1" >> "$GITHUB_ENV"

      # The vulcan.vim smoke test (vulcan-cli/tests/vim_plugin.rs) needs Vim 9
      # and yegappan/lsp; pin the client to the commit the plugin was
      # checked against, and make a missing one a failure.
      - name: Install Vim and yegappan/lsp for the plugin smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.suite == 'cli'
        env:
          YEGAPPAN_LSP_COMMIT: 58eac06e81bad174cfa897614ae01adf0d31d10a
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q vim
          git init -q "$RUNNER_TEMP/yegappan-lsp"
          git -C "$RUNNER_TEMP/yegappan-lsp" fetch -q --depth 1 https://github.com/yegappan/lsp.git "$YEGAPPAN_LSP_COMMIT"
          git -C "$RUNNER_TEMP/yegappan-lsp" checkout -q FETCH_HEAD
          echo "VULCAN_VIM_LSP=$RUNNER_TEMP/yegappan-lsp" >> "$GITHUB_ENV"
          echo "VULCAN_REQUIRE_VIM=1" >> "$GITHUB_ENV"

      - name: Test CLI
        if: matrix.suite == 'cli'
        run: cargo test -p vulcan-cli --no-fail-fast

      - name: Run clippy
        if: matrix.suite == 'cli'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Feature-gated code (js_runtime, oauth, vectors, web) only compiles
      # out without default features, so drift there is invisible above.
      - name: Run clippy without default features
        if: matrix.os == 'ubuntu-latest' && matrix.suite == 'cli'
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
